name: SGAITest
options:
  bundleIdPrefix: com.example.sgai
  deploymentTarget:
    iOS: '17.0'
targets:
  SGAITest:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sgai.SGAITest
        GENERATE_INFOPLIST_FILE: NO
        # Relativa al directorio del proyecto, que ya es ios-app/.
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGNING_ALLOWED: NO
